<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>매일 영어 단어</title>
<style>
:root{
  --bg:#EEF1F5; --paper:#FFFFFF; --ink:#14213D; --muted:#5B6478; --line:#CBD2DE;
  --ok:#0F766E; --okbg:#E1F2EF; --no:#B4432F; --nobg:#F9E5E1; --accent:#1F4E9C; --tag:#FFE9A3;
  --sans:-apple-system,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",system-ui,sans-serif;
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,"Times New Roman",serif;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.5}
button{font-family:inherit;font-size:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
#app{max-width:520px;margin:0 auto;padding:16px 16px 92px}
h1{font-size:22px;margin:0 0 4px;font-weight:700;letter-spacing:-0.01em}
.sub{color:var(--muted);font-size:14px;margin:0 0 20px}
.status{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:18px}
.status div{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:10px 12px;flex:1;min-width:100px}
.status b{display:block;font-size:22px;font-weight:700;line-height:1.1}
.status span{font-size:13px;color:var(--muted)}
.card{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:18px 18px 16px;margin-bottom:14px}
.btn{display:block;width:100%;padding:14px 16px;border-radius:12px;border:none;background:var(--ink);color:#fff;font-weight:600;font-size:17px}
.btn.secondary{background:var(--paper);color:var(--ink);border:1.5px solid var(--ink)}
.btn.ghost{background:transparent;color:var(--accent);border:none;font-weight:600;padding:10px}
.btn:disabled{opacity:.4;cursor:default}
.btn+.btn{margin-top:10px}
.tag{display:inline-block;font-size:13px;padding:3px 9px;border-radius:999px;background:#E4E8F0;color:var(--muted);margin-right:6px}
.tag.review{background:var(--tag);color:#6B5300}
.progress{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;font-size:14px;color:var(--muted)}
.bar{height:4px;background:var(--line);border-radius:2px;margin-bottom:16px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent)}
.q{font-family:var(--serif);font-size:21px;line-height:1.55;margin:10px 0 18px;letter-spacing:.005em}
.q.ko{font-family:var(--sans);font-size:19px}
.blank{display:inline-block;min-width:3.6em;border-bottom:2px solid var(--ink);vertical-align:-3px;height:1.2em}
.hint{font-size:14px;color:var(--muted);margin:-10px 0 14px}
input.ans{width:100%;padding:14px;border:1.5px solid var(--line);border-radius:10px;font-size:18px;font-family:var(--serif);background:#FBFCFD}
.choices button{display:block;width:100%;text-align:left;padding:13px 14px;margin-bottom:8px;background:#FBFCFD;border:1.5px solid var(--line);border-radius:10px;font-family:var(--serif);font-size:17px;line-height:1.4;color:var(--ink)}
.choices button.ko{font-family:var(--sans);font-size:17px}
.word{font-family:var(--serif);font-size:34px;font-weight:600;letter-spacing:-.01em;line-height:1.15;margin:12px 0 2px;word-break:break-word}
.pos{color:var(--muted);font-size:13px;margin:0 0 18px}
.hintw{font-family:var(--serif);font-size:20px;color:var(--muted);letter-spacing:.06em;margin:0 0 14px}
.result .ex{font-family:var(--serif);font-size:15px;opacity:.8;margin-top:4px}
.choices button.ok{background:var(--okbg);border-color:var(--ok)}
.choices button.no{background:var(--nobg);border-color:var(--no)}
.result{border-radius:10px;padding:12px 14px;margin-top:14px;font-size:15px}
.result.ok{background:var(--okbg);color:#0B4F4A}
.result.no{background:var(--nobg);color:#7A2A1D}
.result .a{font-family:var(--serif);font-size:18px;display:block;margin:4px 0}
.result .exp{margin-top:6px;color:var(--ink);opacity:.85}
.list{list-style:none;padding:0;margin:0}
.list li{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:8px}
.list .qq{font-family:var(--serif);font-size:16px;margin:2px 0 4px}
.list .meta{font-size:13px;color:var(--muted)}
.empty{color:var(--muted);text-align:center;padding:30px 10px}
.summary .big{font-size:40px;font-weight:700;line-height:1;margin:6px 0}
.level-note{background:var(--tag);border-radius:10px;padding:10px 12px;margin:12px 0;font-size:15px}
.weekchart{display:flex;gap:6px;align-items:flex-end;height:90px;margin:12px 0 4px}
.weekchart div{flex:1;background:var(--accent);border-radius:4px 4px 0 0;min-height:3px;position:relative}
.weekchart div.empty{background:var(--line)}
.weeklabels{display:flex;gap:6px;font-size:11px;color:var(--muted)}
.weeklabels div{flex:1;text-align:center}
textarea{width:100%;min-height:120px;border:1.5px solid var(--line);border-radius:10px;padding:10px;font-family:ui-monospace,Menlo,monospace;font-size:13px}
.note{font-size:14px;color:var(--muted)}
code{font-family:ui-monospace,Menlo,monospace;font-size:13px;background:#E4E8F0;padding:1px 5px;border-radius:4px}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--paper);border-top:1px solid var(--line);display:flex;padding:6px 8px calc(6px + env(safe-area-inset-bottom))}
nav button{flex:1;background:none;border:none;padding:10px 4px;font-size:13px;color:var(--muted);border-radius:8px}
nav button.on{color:var(--ink);font-weight:700;background:#E4E8F0}
.toast{position:fixed;left:50%;bottom:84px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:999px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s}
.toast.show{opacity:1}
.banner{background:var(--nobg);color:#7A2A1D;border-radius:10px;padding:10px 12px;font-size:14px;margin-bottom:14px}
.row{display:flex;gap:8px}
.row .btn{flex:1}
@media (prefers-reduced-motion:reduce){.toast{transition:none}}
</style>
</head>

const KEY='engquiz-state-v3';
const POS={v:'동사',n:'명사',a:'형용사',ad:'부사·연결어'};
const EXTRA_N=10, MAX_REVIEW=12, EVENING_NEW_MAX=10, SESSION_V=2;
let S=null, memMode=false, view='home', ui={};

function fmt(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function today(){return fmt(new Date())}
function addDays(s,n){const [y,m,d]=s.split('-').map(Number);return fmt(new Date(y,m-1,d+n))}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function defaultState(){return{level:2,streak:0,lastDone:'',history:{},review:{},recent:[],day:null,session:null,packs:[],totals:{answered:0,correct:0},log:[],morningN:18,wordN:30}}
function ensureDay(){const t=today();if(!S.day||S.day.date!==t){S.day={date:t,morning:null,evening:null};S.session=null}}

async function load(){

    const raw=localStorage.getItem(KEY);
    S=Object.assign(defaultState(),raw?JSON.parse(raw):{});
    localStorage.setItem(KEY+':probe','1');localStorage.removeItem(KEY+':probe');
  }catch(e){memMode=true;S=defaultState()}
  // 예전 버전에서 풀다 만 세션은 새 화면과 형식이 달라서 정리 (기록·오답 노트는 그대로 유지)
  if(S.session&&S.session.v!==SESSION_V)S.session=null;
  if(S.day){if(S.day.morning&&S.day.morning.v!==SESSION_V)S.day.morning=null;if(S.day.evening&&S.day.evening.v!==SESSION_V)S.day.evening=null}
}

  catch(e){console.error(e);toast('저장 실패 — 시크릿 모드인지 확인해주세요')}

function allQ(){const m={};BANK.forEach(q=>m[q.id]=q);WORDS.forEach(q=>m[q.id]=q);(S.packs||[]).forEach(p=>p.forEach(q=>m[q.id]=q));return m}
function isWord(q){return !!q&&q.kind==='word'}

/* ---------- 출제 ---------- */
function dueReviews(Q){const t=today();return Object.keys(S.review).filter(id=>Q[id]&&S.review[id].due<=t).sort((a,b)=>S.review[a].due.localeCompare(S.review[b].due))}
function pickNewWords(n,Q,exclude){
  if(n<=0)return [];
  const t=today();
  const ids=Object.keys(Q).filter(id=>isWord(Q[id])&&!exclude.has(id)&&!S.review[id]&&!(S.history[id]&&S.history[id].lastSeen===t));
  const fresh=ids.filter(id=>!S.history[id]),seen=ids.filter(id=>S.history[id]);
  const out=[];
  for(const lv of [1,2,3]){if(out.length>=n)break;out.push(...shuffle(fresh.filter(id=>Q[id].level===lv)).slice(0,n-out.length))}
  if(out.length<n){seen.sort((a,b)=>String(S.history[a].lastSeen).localeCompare(String(S.history[b].lastSeen)));out.push(...seen.slice(0,n-out.length))}
  return shuffle(out);
}
function pickNew(n,Q,exclude){ // 문장 은행 (문법·어휘)
  if(n<=0)return [];
  const order=[S.level,S.level-1,S.level+1].filter(l=>l>=1&&l<=3);
  const rank=id=>{const h=S.history[id];return [order.indexOf(Q[id].level),h?1:0,h?h.lastSeen:'',Math.random()]};
  const cmp=(a,b)=>{const ra=rank(a),rb=rank(b);for(let i=0;i<4;i++){if(ra[i]<rb[i])return -1;if(ra[i]>rb[i])return 1}return 0};
  const t=today();
  const ids=Object.keys(Q).filter(id=>!isWord(Q[id])&&!exclude.has(id)&&!S.review[id]&&order.includes(Q[id].level)&&!(S.history[id]&&S.history[id].lastSeen===t));
  const g=ids.filter(id=>Q[id].type==='g').sort(cmp), v=ids.filter(id=>Q[id].type==='v').sort(cmp);
  const out=[];let wantG=Math.ceil(n/2),wantV=n-wantG;
  out.push(...g.slice(0,wantG));out.push(...v.slice(0,wantV));
  if(out.length<n){const rest=[...g.slice(wantG),...v.slice(wantV)].sort(cmp);out.push(...rest.slice(0,n-out.length))}
  return shuffle(out);
}
function firstSense(s){return String(s).replace(/\([^)]*\)/g,' ').split(',')[0].replace(/\s+/g,' ').trim()}
function makeOpts(w,words,n){
  n=n||4;
  const used=new Set([firstSense(w.ko)]);
  const ok=x=>x.id!==w.id&&x.en!==w.en&&!used.has(firstSense(x.ko));
  const same=shuffle(words.filter(x=>x.pos===w.pos&&x.level===w.level&&ok(x)));
  const near=shuffle(words.filter(x=>x.pos===w.pos&&x.level!==w.level&&ok(x)));
  const any=shuffle(words.filter(x=>x.pos!==w.pos&&ok(x)));
  const picks=[];
  for(const c of [...same,...near,...any]){
    if(picks.length>=n-1)break;
    if(used.has(firstSense(c.ko)))continue;
    used.add(firstSense(c.ko));picks.push(c);
  }
  const opts=shuffle([w,...picks]);
  return {opts:opts.map(o=>o.id),ans:opts.findIndex(o=>o.id===w.id)};
}
function buildPlan(qids,Q,typed){
  const words=Object.keys(Q).map(id=>Q[id]).filter(isWord);
  const plan={};
  qids.forEach(id=>{
    const q=Q[id];if(!isWord(q))return;
    if(typed.has(id)){plan[id]={mode:'type'};return}
    plan[id]=Object.assign({mode:'mc',dir:S.history[id]?'ko2en':'en2ko'},makeOpts(q,words));
  });
  return plan;
}
function buildSession(mode,set){
  ensureDay();
  const Q=allQ(),t=today();
  set=set||'word';
  const inSet=id=>Q[id]&&(set==='word'?isWord(Q[id]):!isWord(Q[id]));
  let due=[],retest=[],n=0;
  if(mode==='morning'){
    n=set==='word'?(S.wordN||30):(S.morningN||18);
    due=dueReviews(Q).filter(inSet).slice(0,MAX_REVIEW);
  }else if(mode==='evening'){
    const m=S.day.morning;
    retest=m?m.results.filter(r=>!r.ok).map(r=>r.id).filter(inSet):[];
    n=retest.length+EVENING_NEW_MAX;
  }else if(mode==='redo'){
    const s=S.session;
    retest=s?s.results.filter(r=>!r.ok).map(r=>r.id).filter(inSet):[];
    n=retest.length;
  }else{ // extra
    n=EXTRA_N;
    due=dueReviews(Q).filter(inSet).slice(0,5);
  }
  const pick=set==='word'?pickNewWords:pickNew;
  const fresh=pick(n-due.length-retest.length,Q,new Set([...due,...retest]));
  const qids=[...due,...retest,...fresh];
  const typed=new Set([...due,...retest]); // 틀렸던 단어는 직접 입력
  S.session={v:SESSION_V,date:t,mode,set,qids,reviewSet:due,retestSet:retest,idx:0,results:[],plan:buildPlan(qids,Q,typed),done:false};
}

/* ---------- 채점 ---------- */
function norm(s){
  s=String(s).toLowerCase().replace(/[’‘`]/g,"'").replace(/[.,!?;:"“”()]/g,' ').replace(/\s+/g,' ').trim();
  const rep=[[/^'m\b/,'am'],[/\bi'm\b/g,'i am'],[/\bcan't\b/g,'cannot'],[/\bwon't\b/g,'will not'],[/n't\b/g,' not'],[/'re\b/g,' are'],[/'ve\b/g,' have'],[/'ll\b/g,' will'],[/'d\b/g,' would'],[/\bthat's\b/g,'that is'],[/\bit's\b/g,'it is'],[/\bwhat's\b/g,'what is'],[/\bthere's\b/g,'there is'],[/\bhere's\b/g,'here is'],[/\bcan not\b/g,'cannot']];
  rep.forEach(([r,t])=>s=s.replace(r,t));
  return s.replace(/\s+/g,' ').trim();
}
function normWord(s){return String(s).toLowerCase().replace(/[^a-z]/g,'')}
function grade(q,input){
  if(isWord(q)){
    const p=S.session.plan[q.id]||{mode:'type'};
    if(p.mode==='mc')return Number(input)===p.ans;
    const u=normWord(input);return !!u&&u===normWord(q.en);
  }
  if(q.kind==='mc')return Number(input)===q.ans;
  const u=norm(input);if(!u)return false;
  return q.a.some(a=>norm(a)===u);
}
function record(id,ok,kind){ // kind: 'new' | 'review' | 'retest'
  const t=today();
  const h=S.history[id]||{seen:0,correct:0,wrong:0,lastSeen:''};
  h.seen++;if(ok)h.correct++;else h.wrong++;h.lastSeen=t;S.history[id]=h;
  if(kind==='retest'){
    if(!ok)S.review[id]={due:addDays(t,1),stage:0};
  }else{
    if(!ok){S.review[id]={due:addDays(t,1),stage:0}}
    else if(kind==='review'){const r=S.review[id];if(!r||r.stage>=2)delete S.review[id];else{r.stage++;r.due=addDays(t,r.stage===1?3:7)}}
    if(kind==='new'){S.recent.push(ok?1:0);if(S.recent.length>40)S.recent.shift()}
  }
  S.totals.answered++;if(ok)S.totals.correct++;
}
function finishSession(){
  const s=S.session,t=today();s.done=true;ensureDay();
  const c=s.results.filter(x=>x.ok).length,n=s.results.length;
  if(s.mode==='morning'){
    S.day.morning=s;
    if(S.lastDone!==t){S.streak=(S.lastDone===addDays(t,-1))?S.streak+1:1;S.lastDone=t}
    S.log.push({date:t,c,n,ec:null,en:null,level:S.level});if(S.log.length>120)S.log.shift();
  }else if(s.mode==='evening'){
    S.day.evening=s;
    const l=S.log.find(x=>x.date===t);if(l){l.ec=c;l.en=n}
  }
}

  app.innerHTML=banner+body;
  const tabs=[['home','오늘'],['notes','오답 노트'],['stats','기록'],['settings','설정']];
  $('nav').innerHTML=tabs.map(([k,l])=>`<button class="${(view===k||(k==='home'&&view==='quiz'))?'on':''}" data-v="${k}">${l}</button>`).join('');
  $('nav').querySelectorAll('button').forEach(b=>b.onclick=()=>{clearTimeout(ui.auto);view=b.dataset.v;render()});
  bind();
}

function statusBar(){
  const Q=allQ();const due=dueReviews(Q).length;
  return `<div class="status">
    <div><b>${S.streak}일</b><span>연속</span></div>
    <div><b>${due}</b><span>오늘 복습</span></div>
    <div><b>${learnedCount(Q)}</b><span>외운 단어</span></div>
  </div>`;
}
function homeView(){
  ensureDay();
  const t=today(),d=S.day,s=S.session,Q=allQ();
  const dateStr=new Date().toLocaleDateString('ko-KR',{month:'long',day:'numeric',weekday:'short'});
  const resuming=s&&s.date===t&&!s.done;
  let morning='',evening='';
  if(resuming&&s.mode==='morning'){
    morning=`<div class="card"><p style="margin:0 0 4px">오늘의 단어</p><p class="sub" style="margin:0 0 14px">${s.idx}/${s.qids.length} 진행 중</p><button class="btn" data-act="resume">이어서 풀기</button></div>`;
  }else if(d.morning){
    const c=d.morning.results.filter(x=>x.ok).length,n=d.morning.results.length;
    morning=`<div class="card"><p style="margin:0 0 4px">오늘의 단어 완료</p><p class="sub" style="margin:0">${n}개 중 ${c}개 정답 · 틀린 ${n-c}개는 저녁에 직접 입력으로</p></div>`;
  }else{
    const due=Math.min(dueReviews(Q).filter(id=>isWord(Q[id])).length,MAX_REVIEW),n=S.wordN||30;
    morning=`<div class="card"><p style="margin:0 0 4px">오늘의 단어 · 약 ${Math.round(n/3)}분</p><p class="sub" style="margin:0 0 14px">새 단어 ${Math.max(0,n-due)}개 객관식${due?` + 틀렸던 ${due}개 직접 입력`:''}</p><button class="btn" data-act="startMorning" ${resuming?'disabled':''}>시작</button></div>`;
  }
  if(resuming&&s.mode==='evening'){
    evening=`<div class="card"><p style="margin:0 0 4px">저녁 복습</p><p class="sub" style="margin:0 0 14px">${s.idx}/${s.qids.length} 진행 중</p><button class="btn" data-act="resume">이어서 풀기</button></div>`;
  }else if(d.evening){
    const c=d.evening.results.filter(x=>x.ok).length,n=d.evening.results.length;
    evening=`<div class="card"><p style="margin:0 0 4px">저녁 복습 완료</p><p class="sub" style="margin:0 0 14px">${n}개 중 ${c}개 정답</p><button class="btn secondary" data-act="extra">단어 ${EXTRA_N}개 더</button></div>`;
  }else if(d.morning){
    const w=d.morning.results.filter(x=>!x.ok).length;
    evening=`<div class="card"><p style="margin:0 0 4px">저녁 복습 · 약 5분</p><p class="sub" style="margin:0 0 14px">아침에 틀린 ${w}개 직접 입력 + 새 단어 ${EVENING_NEW_MAX}개</p><button class="btn" data-act="startEvening" ${resuming?'disabled':''}>시작</button></div>`;
  }else{
    evening=`<div class="card" style="opacity:.55"><p style="margin:0 0 4px">저녁 복습</p><p class="sub" style="margin:0">오늘의 단어를 끝내면 열려요.</p></div>`;
  }
  const sent=`<div class="card"><p style="margin:0 0 4px">문장 연습</p><p class="sub" style="margin:0 0 14px">예전 문법·회화 문장 ${EXTRA_N}문제 (원할 때만)</p><button class="btn secondary" data-act="sent" ${resuming?'disabled':''}>문장으로 풀기</button></div>`;
  return `<h1>매일 영어 단어</h1><p class="sub">${dateStr}</p>${statusBar()}${morning}${evening}${sent}
  <p class="note">새 단어는 객관식으로 빠르게, 틀린 단어만 직접 입력으로 다시 나옵니다. 틀리면 저녁 → 내일 → 3일 뒤 → 7일 뒤 순서로 확인하고 졸업해요.</p>`;
}

function wordBody(q,s,r){
  const p=s.plan[q.id]||{mode:'type'};
  const Q=allQ();
  if(p.mode==='mc'){
    const ko=p.dir==='en2ko';
    const head=ko
      ? `<p class="word">${esc(q.en)}</p><p class="pos">${POS[q.pos]||''}</p>`
      : `<p class="q ko" style="margin-bottom:16px">${esc(q.ko)}</p>`;
    const choices=p.opts.map((id,i)=>{
      const o=Q[id]||q;const label=ko?o.ko:o.en;
      let cls=ko?'ko':'';
      if(r){if(i===p.ans)cls+=' ok';else if(Number(r.input)===i)cls+=' no'}
      return `<button data-choice="${i}" class="${cls.trim()}" ${r?'disabled':''}>${esc(label)}</button>`;
    }).join('');
    return head+`<div class="choices">${choices}</div>`;
  }
  return `<p class="q ko" style="margin-bottom:8px">${esc(q.ko)}</p>
    <p class="hintw">${esc(maskWord(q.en))}</p>
    <input class="ans" id="ansInput" type="text" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="영어 단어" ${r?'disabled':''} value="${r?esc(r.input):''}">
    ${r?'':'<button class="btn" style="margin-top:12px" data-act="check">확인</button>'}`;
}

function quizView(){
  const s=S.session,Q=allQ();
  if(s.done)return summaryView();
  const q=Q[s.qids[s.idx]];
  if(!q){s.idx++;if(s.idx>=s.qids.length)finishSession();return quizView()}
  const isRev=s.reviewSet.includes(q.id),isRetest=(s.retestSet||[]).includes(q.id);
  const r=ui.result;
  const word=isWord(q);
  let body;
  if(word)body=wordBody(q,s,r);
  else if(q.kind==='fill'){
    body=qhtml(q)+(q.level===3?'<p class="hint">문장 전체를 영어로. 대소문자·마침표는 신경 쓰지 않아도 돼요.</p>':'')+
      `<input class="ans" id="ansInput" type="text" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="영어로 입력" ${r?'disabled':''} value="${r?esc(r.input):''}">
       ${r?'':'<button class="btn" style="margin-top:12px" data-act="check">확인</button>'}`;
  }else{
    body=qhtml(q)+`<div class="choices">${q.choices.map((c,i)=>{
      let cls='';if(r){if(i===q.ans)cls='ok';else if(Number(r.input)===i)cls='no'}
      return `<button data-choice="${i}" class="${cls}" ${r?'disabled':''}>${esc(c)}</button>`}).join('')}</div>`;
  }
  let res='';
  if(r){
    const last=s.idx+1>=s.qids.length;
    if(word){
      const head=r.ok?'정답':(isRetest||isRev?'오답 — 내일 한 번 더':'오답 — 저녁에 직접 입력으로 다시');
      res=`<div class="result ${r.ok?'ok':'no'}">${head}
        <span class="a">${esc(q.en)} — ${esc(q.ko)}</span>
        ${q.ex?`<div class="ex">${esc(q.ex)}</div>`:''}</div>`;
    }else{
      const ansText=q.kind==='fill'?q.a[0]:q.choices[q.ans];
      res=`<div class="result ${r.ok?'ok':'no'}">${r.ok?'정답':'오답'}
        ${r.ok?'':`<span class="a">${esc(ansText)}</span>`}
        ${q.exp?`<div class="exp">${esc(q.exp)}</div>`:''}</div>`;
    }
    res+=`<button class="btn" style="margin-top:14px" data-act="next">${last?'결과 보기':'다음'}</button>`;
  }
  const modeName={morning:'오늘의 단어',evening:'저녁 복습',extra:'추가 연습',redo:'틀린 단어 다시'}[s.mode]||'연습';
  return `<div class="progress"><span>${s.idx+1} / ${s.qids.length}</span><span>${modeName}</span></div>
    <div class="bar"><i style="width:${(s.idx/s.qids.length)*100}%"></i></div>
    <div class="card">
      <div><span class="tag">${typeLabel(q)}</span><span class="tag">Lv ${q.level}</span>${isRev?'<span class="tag review">복습</span>':''}${isRetest?'<span class="tag review">틀렸던 것</span>':''}</div>
      ${body}${res}
    </div>`;
}

function summaryView(){
  const s=S.session,Q=allQ();
  const c=s.results.filter(x=>x.ok).length,n=s.results.length;
  const wrong=s.results.filter(x=>!x.ok);
  const title={morning:'오늘의 단어 완료',evening:'저녁 복습 완료',extra:'추가 연습 완료',redo:'다시 풀기 완료'}[s.mode]||'완료';
  const next=s.mode==='morning'?`틀린 ${wrong.length}개는 저녁에 직접 입력으로 다시 나와요`:`틀린 ${wrong.length}개는 내일 다시 나와요`;
  const list=wrong.map(w=>{
    const q=Q[w.id];if(!q)return '';
    if(isWord(q))return `<li><div class="meta">단어 · Lv ${q.level}</div><div class="qq"><b>${esc(q.en)}</b> — ${esc(q.ko)}</div>${q.ex?`<div class="meta">${esc(q.ex)}</div>`:''}</li>`;
    const a=q.kind==='fill'?q.a[0]:q.choices[q.ans];
    return `<li><div class="meta">${typeLabel(q)}</div><div class="qq">${esc(q.q)}</div><div class="qq" style="color:var(--ok)">${esc(a)}</div></li>`;
  }).join('');
  return `<div class="card summary"><p style="margin:0">${title}</p>
    <div class="big">${c} / ${n}</div>
    <p class="sub" style="margin:0">${wrong.length?next:'전부 맞혔어요'}</p>
    ${wrong.length?`<ul class="list" style="margin-top:14px">${list}</ul>
      <button class="btn" style="margin-top:6px" data-act="redo">틀린 ${wrong.length}개 바로 다시</button>
      <button class="btn secondary" data-act="home">홈으로</button>`
    :`<button class="btn" style="margin-top:16px" data-act="home">홈으로</button>`}
  </div>`;
}

function notesView(){
  const Q=allQ(),t=today();
  const ids=Object.keys(S.review).filter(id=>Q[id]).sort((a,b)=>S.review[a].due.localeCompare(S.review[b].due));
  if(!ids.length)return `<h1>오답 노트</h1><p class="sub">틀린 것이 자동으로 쌓입니다</p><div class="empty">아직 비어 있어요.<br>틀린 단어가 생기면 여기서 다시 볼 수 있어요.</div>`;
  const stageName=['1일 뒤','3일 뒤','7일 뒤'];
  return `<h1>오답 노트</h1><p class="sub">${ids.length}개 · 다음에 나올 때는 직접 입력이에요</p>
    <ul class="list">${ids.map(id=>{const q=Q[id],r=S.review[id],h=S.history[id]||{wrong:0};
      const dueTxt=r.due<=t?'오늘':r.due===addDays(t,1)?'내일':r.due;
      const meta=`<div class="meta">${typeLabel(q)} · ${h.wrong}번 틀림 · 다음 확인 ${dueTxt} (${stageName[r.stage]||''} 단계)</div>`;
      if(isWord(q))return `<li>${meta}<div class="qq"><b>${esc(q.en)}</b> — ${esc(q.ko)}</div>${q.ex?`<div class="meta">${esc(q.ex)}</div>`:''}</li>`;
      const a=q.kind==='fill'?q.a[0]:q.choices[q.ans];
      return `<li>${meta}<div class="qq">${esc(q.q)}</div><div class="qq" style="color:var(--ok)">${esc(a)}</div>${q.exp?`<div class="meta">${esc(q.exp)}</div>`:''}</li>`}).join('')}</ul>`;
}

function statsView(){
  const t=today();const days=[];for(let i=6;i>=0;i--)days.push(addDays(t,-i));
  const byDate={};S.log.forEach(l=>byDate[l.date]=l);
  const bars=days.map(d=>{const l=byDate[d];const h=l?Math.max(8,Math.round(l.c/l.n*100)):0;return `<div class="${l?'':'empty'}" style="height:${l?h:3}%" title="${d}${l?` ${l.c}/${l.n}`:''}"></div>`}).join('');
  const labels=days.map(d=>`<div>${Number(d.slice(8))}일</div>`).join('');
  const acc=S.totals.answered?Math.round(S.totals.correct/S.totals.answered*100):0;
  const Q=allQ();
  const total=wordCount(Q),learned=learnedCount(Q);
  const seenW=Object.keys(S.history).filter(id=>isWord(Q[id])).length;
  return `<h1>기록</h1><p class="sub">최근 7일 정답률</p>
    <div class="card"><div class="weekchart">${bars}</div><div class="weeklabels">${labels}</div></div>
    ${statusBar()}
    <div class="card">
      <p style="margin:0 0 8px">단어 진행 <b>${learned}</b> / ${total}</p>
      <div class="bar" style="margin-bottom:12px"><i style="width:${total?Math.round(learned/total*100):0}%"></i></div>
      <p style="margin:0 0 6px">본 적 있는 단어 <b>${seenW}</b>개</p>
      <p style="margin:0 0 6px">전체 정답률 <b>${acc}%</b> (${S.totals.correct}/${S.totals.answered})</p>
      <p style="margin:0">오답 노트 <b>${Object.keys(S.review).length}</b>개</p>
    </div>
    <p class="note">한 번 맞히고 오답 노트에서 졸업한 단어를 "외운 단어"로 셉니다.</p>`;
}

function settingsView(){
  return `<h1>설정</h1><p class="sub">문제 수와 기록 관리</p>
    <div class="card"><p style="margin:0 0 8px">하루 단어 수</p>
      <div class="row">${[20,30,40].map(n=>`<button class="btn ${(S.wordN||30)===n?'':'secondary'}" data-wn="${n}">${n}개</button>`).join('')}</div>
      <p class="note" style="margin:10px 0 0">30개가 대략 10분입니다. 저녁 복습은 틀린 단어 + 새 단어 ${EVENING_NEW_MAX}개로 자동 구성돼요.</p>
    </div>
    <div class="card"><p style="margin:0 0 8px">문장 연습 난이도</p>
      <div class="row">${[1,2,3].map(l=>`<button class="btn ${S.level===l?'':'secondary'}" data-level="${l}">Lv ${l}</button>`).join('')}</div>
      <p class="note" style="margin:10px 0 0">문장 연습에만 적용됩니다. Lv1 형태 채우기 · Lv2 시제와 오류 수정 · Lv3 문장 통째로 영작</p>
    </div>
    <div class="card"><p style="margin:0 0 8px">문제 팩 추가</p>
      <p class="note" style="margin:0 0 10px">Claude가 만들어준 단어 팩(JSON)을 붙여넣으면 은행에 합쳐집니다. 같은 id는 덮어써요.</p>
      <textarea id="packInput" placeholder='[{"id":"w301","type":"w","level":2,"kind":"word","pos":"v","en":"refine","ko":"다듬다","ex":"refine the estimate"}]'></textarea>
      <button class="btn secondary" style="margin-top:10px" data-act="addPack">팩 추가</button>
      <p class="note" style="margin:10px 0 0">추가된 팩: ${(S.packs||[]).length}개 · ${(S.packs||[]).reduce((a,p)=>a+p.length,0)}개 문항</p>
    </div>
    <div class="card"><p style="margin:0 0 8px">초기화</p>
      <p class="note" style="margin:0 0 10px">기록·오답 노트가 전부 지워집니다. 추가한 팩은 남아요.</p>
      <button class="btn ghost" data-act="reset">모든 기록 지우기</button>
    </div>
    <div class="card"><p style="margin:0 0 8px">기록 백업 / 옮기기</p>
      <p class="note" style="margin:0 0 10px">기록은 이 브라우저에만 저장됩니다. 폰을 바꾸거나 브라우저 데이터를 지우면 사라져요.</p>
      <div class="row"><button class="btn secondary" data-act="exportState">내보내기</button><button class="btn secondary" data-act="importState">가져오기</button></div>
    </div>
    <p class="note">저장 위치: ${memMode?'저장 불가 (시크릿 모드)':'이 브라우저 (localStorage)'}</p>`;
}

/* ---------- 이벤트 ---------- */
function bind(){
  document.querySelectorAll('[data-act]').forEach(b=>b.onclick=()=>act(b.dataset.act));
  document.querySelectorAll('[data-choice]').forEach(b=>b.onclick=()=>submit(b.dataset.choice));
  document.querySelectorAll('[data-wn]').forEach(b=>b.onclick=async()=>{S.wordN=Number(b.dataset.wn);await save();render()});
  document.querySelectorAll('[data-level]').forEach(b=>b.onclick=async()=>{S.level=Number(b.dataset.level);await save();toast(`문장 연습 Lv ${S.level}`);render()});
  const inp=$('ansInput');
  if(inp){if(!ui.result)setTimeout(()=>inp.focus(),50);inp.onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();ui.result?act('next'):submit(inp.value)}}}
}
async function act(a){
  clearTimeout(ui.auto);
  if(a==='startMorning'){buildSession('morning','word');ui.result=null;view='quiz';await save();render()}
  else if(a==='startEvening'){buildSession('evening','word');ui.result=null;view='quiz';await save();render()}
  else if(a==='extra'){buildSession('extra','word');ui.result=null;view='quiz';await save();render()}
  else if(a==='sent'){buildSession('extra','sent');ui.result=null;view='quiz';await save();render()}
  else if(a==='redo'){const set=S.session&&S.session.set||'word';buildSession('redo',set);ui.result=null;view='quiz';await save();render()}
  else if(a==='resume'){ui.result=null;view='quiz';render()}
  else if(a==='check'){const inp=$('ansInput');submit(inp?inp.value:'')}
  else if(a==='next'){const s=S.session;s.idx++;ui.result=null;if(s.idx>=s.qids.length)finishSession();await save();render();window.scrollTo(0,0)}
  else if(a==='home'){view='home';render()}
  else if(a==='addPack'){addPack()}
  else if(a==='exportState'){const t=$('packInput');if(t){t.value=JSON.stringify(S);t.scrollIntoView({block:'center'});toast('아래 칸 내용을 복사해 두세요')}}
  else if(a==='importState'){const t=$('packInput');if(!t||!t.value.trim()){toast('아래 칸에 백업 내용을 붙여넣으세요');return}
    try{const o=JSON.parse(t.value);if(!o.history||!o.totals)throw 0;S=Object.assign(defaultState(),o);S.session=null;await save();toast('복원했어요');view='home';render()}catch(e){toast('백업 형식이 아니에요')}}
  else if(a==='reset'){if(confirm('모든 기록을 지울까요? 되돌릴 수 없어요.')){const packs=S.packs||[];S=defaultState();S.packs=packs;await save();toast('초기화했어요');view='home';render()}}
}
async function submit(input){
  if(ui.result)return;
  const s=S.session,Q=allQ(),q=Q[s.qids[s.idx]];
  const ok=grade(q,input);
  const kind=s.reviewSet.includes(q.id)?'review':(s.retestSet||[]).includes(q.id)?'retest':'new';
  record(q.id,ok,kind);
  s.results.push({id:q.id,ok});
  ui.result={ok,input};
  await save();render();
  if(ok){clearTimeout(ui.auto);ui.auto=setTimeout(()=>act('next'),650)} // 맞히면 알아서 다음으로
}
async function addPack(){
  const ta=$('packInput');let arr;
  try{arr=JSON.parse(ta.value)}catch(e){toast('JSON 형식이 아니에요');return}
  if(!Array.isArray(arr)){toast('배열 형태여야 해요');return}
  const bad=arr.find(q=>!q.id||!q.type||!q.level||!q.kind||(q.kind==='word'&&(!q.en||!q.ko))||(q.kind==='fill'&&!Array.isArray(q.a))||(q.kind==='mc'&&(!Array.isArray(q.choices)||typeof q.ans!=='number')));
  if(bad){toast('형식이 맞지 않는 문항이 있어요');return}
  arr.forEach(q=>{if(q.kind==='word'&&!q.q)q.q=q.ko});
  S.packs=S.packs||[];S.packs.push(arr);await save();toast(`${arr.length}개 추가`);render();
}

/* ---------- 시작 ---------- */
(async()=>{
  await load();
  const before=JSON.stringify(S.day);ensureDay();
  if(JSON.stringify(S.day)!==before)await save();
  render();
})();
</script>
