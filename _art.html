<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><title>Flow 변형</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap">
<style>
  body{margin:0;background:#e9e9ea;font-family:Inter,sans-serif;color:#111}
  h1{font-size:14px;font-weight:600;margin:0;padding:18px 22px 4px}
  p.note{margin:0;padding:0 22px 14px;font-size:13px;color:#555;line-height:1.6}
  .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;padding:0 14px 20px}
  figure{margin:0;background:#fff;border:1px solid #d5d5d7;border-radius:8px;overflow:hidden}
  figcaption{padding:10px 13px;font-size:13px;border-bottom:1px solid #eee}
  figcaption b{display:block;font-weight:600;margin-bottom:3px}
  figcaption span{color:#666;font-size:12px;line-height:1.5;display:block}
  figcaption a{color:#111;font-size:12px;display:inline-block;margin-top:6px}
  iframe{display:block;width:250%;height:1460px;border:0;transform:scale(.4);transform-origin:0 0;margin-bottom:-876px}
</style></head><body>
<h1>Flow 변형 5종</h1>
<p class="note">원본(1)이 과하다고 하셔서 밀도·길이·범위를 다르게 뺐습니다. 마지막은 물 느낌. <b>커서를 움직여야 본모습입니다</b> — “크게”로 여세요.</p>
<div class="grid">
  <figure><figcaption><b>A · Quiet</b><span>같은 그림, 획을 성기게. 밀도를 절반 이하로 줄이고 더 연하게.</span><a href="/?art=flow-quiet" target="_blank">크게 ↗</a></figcaption><iframe src="/?art=flow-quiet" loading="lazy"></iframe></figure>
  <figure><figcaption><b>B · Long</b><span>획 수를 크게 줄이고 하나하나를 아주 길게. 큰 붓질 몇 개로 읽힙니다.</span><a href="/?art=flow-long" target="_blank">크게 ↗</a></figcaption><iframe src="/?art=flow-long" loading="lazy"></iframe></figure>
  <figure><figcaption><b>C · Edge</b><span>가운데는 완전히 비우고 가장자리에만. 글 뒤에는 아무것도 없습니다.</span><a href="/?art=flow-edge" target="_blank">크게 ↗</a></figcaption><iframe src="/?art=flow-edge" loading="lazy"></iframe></figure>
  <figure><figcaption><b>D · Dash</b><span>긴 획 대신 짧은 자국이 촘촘히. 선이 아니라 결로 보입니다.</span><a href="/?art=flow-dash" target="_blank">크게 ↗</a></figcaption><iframe src="/?art=flow-dash" loading="lazy"></iframe></figure>
  <figure><figcaption><b>E · Water</b><span>수면. 긴 너울 위에 잔물결이 얹히고, 커서가 표면을 끌고 다닙니다. <b>클릭하면 그 자리에서 파문이 번집니다.</b></span><a href="/?art=water" target="_blank">크게 ↗</a></figcaption><iframe src="/?art=water" loading="lazy"></iframe></figure>
  <figure><figcaption><b>원본</b><span>처음 보여드린 flow. 비교용.</span><a href="/?art=flow" target="_blank">크게 ↗</a></figcaption><iframe src="/?art=flow" loading="lazy"></iframe></figure>
</div>
<p class="note">진하기는 고른 뒤에 맞춥니다. 조합도 가능 — 예: Water를 가장자리에만 (C의 마스크를 E에 씌우기).</p>
</body></html>
