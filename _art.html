<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><title>아트 디렉션 후보</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap">
<style>
  body{margin:0;background:#e9e9ea;font-family:Inter,sans-serif;color:#111}
  h1{font-size:14px;font-weight:600;margin:0;padding:18px 22px 4px}
  p.note{margin:0;padding:0 22px 14px;font-size:13px;color:#555;line-height:1.6}
  .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;padding:0 14px 22px}
  figure{margin:0;background:#fff;border:1px solid #d5d5d7;border-radius:8px;overflow:hidden}
  figcaption{padding:10px 13px;font-size:13px;border-bottom:1px solid #eee}
  figcaption b{display:block;font-weight:600;margin-bottom:3px}
  figcaption span{color:#666;font-size:12px;line-height:1.5;display:block}
  figcaption a{color:#111;font-size:12px;display:inline-block;margin-top:6px}
  iframe{display:block;width:250%;height:1500px;border:0;transform:scale(.4);transform-origin:0 0;margin-bottom:-900px}

<h1>아트 디렉션 후보 3종 · 실제 페이지</h1>
<p class="note">셋 다 마우스를 움직여야 살아납니다. 축소 미리보기라 잘 안 보이니 <b>“크게”로 열어서 커서를 움직여보세요.</b> 각 페이지 안에서 다크 토글도 됩니다.</p>
<div class="grid">
  <figure><figcaption><b>1 · BEV Field</b><span>차선 지오메트리가 배경 전체에서 살아 움직입니다. 차가 전진하듯 흘러가고, 커서 쪽으로 도로가 기웁니다.</span><a href="/?art=bev" target="_blank">크게 ↗</a></figcaption><iframe src="/?art=bev" loading="lazy"></iframe></figure>
  <figure><figcaption><b>2 · Halftone</b><span>인물사진을 망점 인쇄물로 변환합니다. 사진이 아니라 판화 같은 오브제가 됩니다.</span><a href="/?art=halftone" target="_blank">크게 ↗</a></figcaption><iframe src="/?art=halftone" loading="lazy"></iframe></figure>
  <figure><figcaption><b>3 · Kinetic Type</b><span>이름이 작품이 됩니다. 커서가 지나가면 글자 굵기의 파도가 이름을 통과합니다.</span><a href="/?art=kinetic" target="_blank">크게 ↗</a></figcaption><iframe src="/?art=kinetic" loading="lazy"></iframe></figure>
</div>
<p class="note">0 · 지금 상태: <a href="/" target="_blank">크게 ↗</a> &nbsp;·&nbsp; 조합도 됩니다 — 예: <a href="/?art=bev" target="_blank">BEV</a> + 나중에 halftone을 같이 켜는 식.</p>
</body></html>
