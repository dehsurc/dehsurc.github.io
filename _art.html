<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><title>배경 패턴 후보</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap">
<style>
  body{margin:0;background:#e9e9ea;font-family:Inter,sans-serif;color:#111}
  h1{font-size:14px;font-weight:600;margin:0;padding:18px 22px 4px}
  p.note{margin:0;padding:0 22px 14px;font-size:13px;color:#555;line-height:1.6}
  .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;padding:0 14px 20px}
  figure{margin:0;background:#fff;border:1px solid #d5d5d7;border-radius:8px;overflow:hidden}
  figcaption{padding:10px 13px;font-size:13px;border-bottom:1px solid #eee}
  figcaption b{display:block;font-weight:600;margin-bottom:3px}
  figcaption span{color:#666;font-size:12px;line-height:1.5;display:block}
  figcaption a{color:#111;font-size:12px;display:inline-block;margin-top:6px}
  iframe{display:block;width:250%;height:1460px;border:0;transform:scale(.4);transform-origin:0 0;margin-bottom:-876px}
</style></head><body>
<h1>배경 패턴 5종 · 실제 페이지</h1>
<p class="note">전부 무채색, 잉크 15% 이하. <b>커서를 움직여야 반응이 보입니다</b> — 축소 미리보기 말고 “크게”로 여세요.</p>
<div class="grid">
  <figure><figcaption><b>1 · Flow</b><span>얇은 곡선 다발이 천천히 도는 장을 따라 흐릅니다. 커서 근처에서 소용돌이가 생깁니다.</span><a href="/?art=flow" target="_blank">크게 ↗</a></figcaption><iframe src="/?art=flow" loading="lazy"></iframe></figure>
  <figure><figcaption><b>2 · Waves</b><span>세로선이 아래로 갈수록 크게 물결칩니다. 커서가 지나가면 그 자리가 움푹 들어갑니다.</span><a href="/?art=waves" target="_blank">크게 ↗</a></figcaption><iframe src="/?art=waves" loading="lazy"></iframe></figure>
  <figure><figcaption><b>3 · Forms</b><span>기울어진 막대와 원반이 바닥 없이 떠 있습니다. 깊이가 달라서 커서에 따라 따로 움직입니다.</span><a href="/?art=forms" target="_blank">크게 ↗</a></figcaption><iframe src="/?art=forms" loading="lazy"></iframe></figure>
  <figure><figcaption><b>4 · Hatch</b><span>화면이 면으로 나뉘고 각 면이 다른 각도의 빗금으로 채워집니다. 커서가 올라간 면은 각도가 돌아갑니다.</span><a href="/?art=hatch" target="_blank">크게 ↗</a></figcaption><iframe src="/?art=hatch" loading="lazy"></iframe></figure>
  <figure><figcaption><b>5 · Bands</b><span>폭이 제각각인 세로 띠. 몇 개씩 켜지고 꺼지며, 커서를 따라 스캔선이 지나갑니다.</span><a href="/?art=bands" target="_blank">크게 ↗</a></figcaption><iframe src="/?art=bands" loading="lazy"></iframe></figure>
  <figure><figcaption><b>0 · 없음</b><span>지금 상태. 배경 장식 없이 커서 빛만.</span><a href="/" target="_blank">크게 ↗</a></figcaption><iframe src="/" loading="lazy"></iframe></figure>
</div>
<p class="note">세기(진하기)는 고른 다음에 맞추면 됩니다. 배경과 별개로 쓸 수 있는 것도 있습니다 — 사진을 망점으로 바꾸는 <a href="/?art=halftone" target="_blank">halftone</a>, 커서가 지나가면 이름 굵기가 물결치는 <a href="/?art=kinetic" target="_blank">kinetic</a>.</p>
</body></html>
