<h1>바다 · 위에서 내려다본 수면</h1>
<p class="note">평행선을 버리고 높이장의 등고선으로 다시 그렸습니다. 서로 다른 각도의 파도 다섯 줄기가 겹쳐서 마루가 엉키고, 그 등고선이 닫힌 곡선으로 나옵니다. <b>커서 아래는 물이 솟고, 클릭하면 파문이 퍼져나갑니다.</b></p>
<div class="grid">
  <figure><figcaption><b>기본</b><span>등고선 5단, 셀 16px.</span><a href="/?w=0" target="_blank">크게 ↗</a></figcaption><iframe src="/?w=0" loading="lazy"></iframe></figure>
  <figure><figcaption><b>B · 촘촘</b><span>8단. 마루 사이가 더 촘촘해 수면 질감이 살아납니다.</span><a href="/?w=b" target="_blank">크게 ↗</a></figcaption><iframe src="/?w=b" loading="lazy"></iframe></figure>
  <figure><figcaption><b>C · 굵고 크게</b><span>3단만, 선도 굵게. 파도 몇 개가 크게 지나갑니다.</span><a href="/?w=c" target="_blank">크게 ↗</a></figcaption><iframe src="/?w=c" loading="lazy"></iframe></figure>
  <figure><figcaption><b>D · 해도(海圖)</b><span>11단, 파형도 잘게. 해양 등심선 지도에 가장 가깝습니다.</span><a href="/?w=d" target="_blank">크게 ↗</a></figcaption><iframe src="/?w=d" loading="lazy"></iframe></figure>
  <figure><figcaption><b>E · 높은 고도</b><span>파장을 2배로. 더 멀리서 내려다본 것처럼 완만하고 크게.</span><a href="/?w=e" target="_blank">크게 ↗</a></figcaption><iframe src="/?w=e" loading="lazy"></iframe></figure>
